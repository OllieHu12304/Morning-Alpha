<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Morning Alpha 最新科技新聞 dashboard"
    >
    <title>Morning Alpha | 科技新聞分析</title>
    <link rel="stylesheet" href="styles.css">
    <script
        src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"
        defer
    ></script>
    <script src="app.js" defer></script>
</head>
<body>
    <header class="page-header">
        <div class="header-content">
            <p class="eyebrow">Morning Alpha v0.1</p>
            <h1>科技新聞分析</h1>
            <p class="subtitle">
                從 MySQL 匯出的新聞資料，快速掌握來源、主題與熱門關鍵字。
            </p>
        </div>
    </header>

    <main class="page-content">
        <section class="analytics-section" aria-labelledby="analytics-heading">
            <div class="section-heading">
                <div>
                    <p class="section-label">Market Overview</p>
                    <h2 id="analytics-heading">新聞資料概覽</h2>
                </div>
                <p id="chart-status-message" class="status-message" role="status">
                    正在載入統計資料…
                </p>
            </div>

            <div class="chart-grid">
                <article class="chart-card">
                    <div class="chart-heading">
                        <h3>新聞來源</h3>
                        <p>各來源的文章數量</p>
                    </div>
                    <div class="chart-container">
                        <canvas
                            id="source-chart"
                            role="img"
                            aria-label="新聞來源文章數量圖表"
                        >新聞來源文章數量圖表</canvas>
                        <p class="chart-empty-message" hidden></p>
                    </div>
                </article>

                <article class="chart-card">
                    <div class="chart-heading">
                        <h3>主題分類</h3>
                        <p>依標題關鍵字推論的新聞主題</p>
                    </div>
                    <div class="chart-container">
                        <canvas
                            id="category-chart"
                            role="img"
                            aria-label="新聞主題分類文章數量圖表"
                        >新聞主題分類文章數量圖表</canvas>
                        <p class="chart-empty-message" hidden></p>
                    </div>
                </article>

                <article class="chart-card chart-card-wide">
                    <div class="chart-heading">
                        <h3>熱門關鍵字</h3>
                        <p>新聞標題中出現次數最多的 10 個關鍵字</p>
                    </div>
                    <div class="chart-container chart-container-wide">
                        <canvas
                            id="keyword-chart"
                            role="img"
                            aria-label="熱門關鍵字文章數量圖表"
                        >熱門關鍵字文章數量圖表</canvas>
                        <p class="chart-empty-message" hidden></p>
                    </div>
                </article>
            </div>
        </section>

        <section class="news-panel" aria-labelledby="news-heading">
            <div class="panel-heading">
                <div>
                    <p class="section-label">Latest News</p>
                    <h2 id="news-heading">新聞列表</h2>
                </div>
                <p id="status-message" class="status-message" role="status">
                    正在載入新聞資料…
                </p>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th scope="col" data-key="title" aria-sort="none">
                                <button class="sort-button" type="button">
                                    Title <span class="sort-indicator">↕</span>
                                </button>
                            </th>
                            <th
                                scope="col"
                                data-key="publish_time"
                                aria-sort="descending"
                            >
                                <button class="sort-button" type="button">
                                    Publish Time
                                    <span class="sort-indicator">↓</span>
                                </button>
                            </th>
                            <th scope="col" data-key="url" aria-sort="none">
                                <button class="sort-button" type="button">
                                    URL <span class="sort-indicator">↕</span>
                                </button>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="news-table-body"></tbody>
                </table>
            </div>

            <noscript>
                <p class="error-message">
                    請啟用 JavaScript，才能載入及排序新聞資料。
                </p>
            </noscript>
        </section>
    </main>
</body>
</html>
